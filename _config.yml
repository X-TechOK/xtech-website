form_endpoint: "https://script.google.com/macros/s/AKfycbyGG9RydFdpKDYLsflPzcljk0DZ1ntrmAEkJ4SAM6FNUa64vSnRglIjlFot01TCOFW7/exec"

# Build settings
markdown: kramdown
kramdown:
  input: GFM          # lets blog posts use GitHub-style Markdown (tables, ``` code blocks)
timezone: America/Chicago

# ---------------------------------------------------------------------------
# Blog ("Insights")
# Posts live in _posts/ and are named YYYY-MM-DD-your-title.md
# Each post's web address becomes  https://x-tech.tv/blog/your-title/
# See BLOG-GUIDE.md for the step-by-step.
# ---------------------------------------------------------------------------
permalink: /blog/:title/

plugins:
  - jekyll-feed      # builds /feed.xml so people (and feed readers) can follow the blog

feed:
  path: feed.xml
  posts_limit: 20

# Every post automatically uses the "post" layout — no need to type it each time
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Exclude files from processing
# IMPORTANT: this used to be "*.md", which would ALSO have hidden every blog
# post. "[A-Z]*.md" hides only the capital-letter documentation files
# (README.md, SETUP-GUIDE.md, BLOG-GUIDE.md, ...) and leaves _posts/ alone.
exclude:
  - "[A-Z]*.md"     # documentation stays in the repo but off the live site
  - LICENSE
  - preview-home.html   # local preview only
  - docs/               # setup notes and how-to guides (kept in the repo, not published)
