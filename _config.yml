baseurl: "" # Leave empty for GitHub Pages root domain
url: "https://x-tech.tv"

# Analytics — paste your real IDs here after creating accounts (see docs/SETUP-TRACKING-AND-SEO.md)
# Leave blank to disable. Nothing breaks while blank.
ga4_id: "G-DL48ZHN0B0"
