<!-- LLM-Powered Intelligent Chat Widget with lead qualification, contextual greetings & exit intent -->
<div id="chat-widget">
    <!-- Chat Button -->
    <button id="chat-button" class="chat-button" aria-label="Open chat">
        <svg class="chat-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <svg class="close-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
        <span class="chat-badge">1</span>
    </button>

    <!-- Chat Window -->
    <div id="chat-window" class="chat-window">
        <div class="chat-header">
            <div class="chat-header-info">
                <img src="logo.webp" alt="X-Tech" class="chat-logo">
                <div>
                    <h3>X-Tech AI Assistant</h3>
                    <p class="chat-status"><span class="status-dot"></span> Online</p>
                </div>
            </div>
            <button id="minimize-chat" class="minimize-button" aria-label="Minimize chat">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </div>

        <div class="chat-body">
            <div class="chat-messages" id="chat-messages">
                <!-- Messages added dynamically -->
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typing-indicator" style="display: none;">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <!-- Chat Input -->
            <div class="chat-input-container" id="chat-input-container">
                <textarea id="chat-input" placeholder="Ask me anything..." rows="1"></textarea>
                <button type="button" id="send-button" class="chat-send-button" aria-label="Send message">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>

            <!-- Contact Form (Hidden Initially) -->
            <div class="contact-form-container" id="contact-form-container" style="display: none;">
                <form id="contact-form">
                    <input type="text" id="contact-name" placeholder="Your name *" required>
                    <input type="email" id="contact-email" placeholder="Your email *" required>
                    <input type="tel" id="contact-phone" placeholder="Your phone (optional)">
                    <textarea id="contact-message" placeholder="Your message *" rows="3" required></textarea>
                    <button type="submit" class="submit-btn">Send Message</button>
                    <button type="button" class="cancel-btn" id="cancel-form">Back to Chat</button>
                </form>
            </div>
        </div>

        <div class="chat-footer">
            <p>Powered by X-Tech AI • <a href="tel:+1-405-247-0083" style="color: inherit;">Call (405) 247-0083</a></p>
        </div>
    </div>
</div>

<script>
// ============================================
// CONFIGURATION
// ============================================
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyGG9RydFdpKDYLsflPzcljk0DZ1ntrmAEkJ4SAM6FNUa64vSnRglIjlFot01TCOFW7/exec';
const CALENDAR_URL = 'https://calendar.google.com/calendar/appointments/schedules/AcZssZ2uSOKodtmVHB_wPc6rUDklUM8oSZb-pTpbh-B0quILGAjkbSwmtRCR88ARiRgIMSwZ7ERBwBRG?gv=true';

// ============================================
// LLM-Powered Chatbot System
// ============================================
document.addEventListener('DOMContentLoaded', function() {
    const chatButton = document.getElementById('chat-button');
    const chatWindow = document.getElementById('chat-window');
    const minimizeChat = document.getElementById('minimize-chat');
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const sendButton = document.getElementById('send-button');
    const chatBadge = document.querySelector('.chat-badge');
    const typingIndicator = document.getElementById('typing-indicator');
    const chatInputContainer = document.getElementById('chat-input-container');
    const contactFormContainer = document.getElementById('contact-form-container');
    const contactForm = document.getElementById('contact-form');
    const cancelFormBtn = document.getElementById('cancel-form');

    let chatOpen = false;
    let conversationHistory = [];
    let isProcessing = false;
    let transcriptSaved = false;
    let leadProfile = { interest: null };

    function track(name) {
        if (window.xtechTrack) window.xtechTrack(name, { location: window.location.pathname });
    }

    // ============================================
    // Contextual greetings per page
    // ============================================
    function getContextualGreeting() {
        const path = window.location.pathname;
        if (window.location.hash === '#dna' || sessionStorage.getItem('xt_dna_interest')) {
            return "Hi! 👋 Curious about <strong>Corporate DNA™</strong>? I can explain what a DNA briefing covers, or help you request one right here.";
        }
        if (path.indexOf('services') !== -1) {
            return "Hi! 👋 Looking through our services? Tell me a bit about your business and I'll point you to the right solution — or connect you with our team.";
        }
        if (path.indexOf('careers') !== -1) {
            return "Hi! 👋 Interested in joining X-Tech? I can tell you about our culture, what we look for, and how to apply.";
        }
        if (path.indexOf('story') !== -1) {
            return "Hi! 👋 That's 25+ years of transformation history you're looking at. Want to know how that experience could apply to your business?";
        }
        return "Hi there! 👋 I'm the X-Tech AI Assistant. What brings you in today?";
    }

    // ============================================
    // Quick-reply qualification chips
    // ============================================
    function showQuickReplies() {
        if (document.getElementById('quick-replies')) return;
        const qr = document.createElement('div');
        qr.id = 'quick-replies';
        qr.className = 'quick-replies';
        const options = [
            { label: '⚙️ Automating my business', value: 'I want to automate manual processes in my business' },
            { label: '💻 Software help', value: 'I need help with software implementation or support' },
            { label: '🧬 Corporate DNA™', value: 'Tell me about Corporate DNA' },
            { label: '📅 Book a call', value: '__schedule__' }
        ];
        options.forEach(opt => {
            const b = document.createElement('button');
            b.className = 'quick-reply';
            b.textContent = opt.label;
            b.addEventListener('click', function() {
                qr.remove();
                if (opt.value === '__schedule__') {
                    track('chat_quick_schedule');
                    window.open(CALENDAR_URL, '_blank');
                    return;
                }
                leadProfile.interest = opt.label;
                track('chat_quick_reply');
                addMessage(opt.value, false);
                getLLMResponse(opt.value);
            });
            qr.appendChild(b);
        });
        chatMessages.appendChild(qr);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // ============================================
    // Initialize Chat
    // ============================================
    function initializeChat() {
        addBotMessage(getContextualGreeting());
        showQuickReplies();
    }

    // Show badge after delay (attention nudge)
    setTimeout(() => {
        if (!chatOpen) chatBadge.style.display = 'flex';
    }, 3000);

    // ============================================
    // Exit intent (desktop): once per session
    // ============================================
    document.addEventListener('mouseout', function(e) {
        if (e.clientY > 10 || e.relatedTarget) return;
        if (sessionStorage.getItem('xt_exit_shown') || chatOpen) return;
        sessionStorage.setItem('xt_exit_shown', '1');
        track('exit_intent_shown');
        openChat();
        if (chatMessages.children.length === 0) {
            addBotMessage("Before you go — most owners we talk to are losing hours every week to manual processes. Want a <strong>free 30-minute consultation</strong> to see what's possible? No pitch, just a diagnosis.", 0, true);
            showQuickReplies();
        }
    });

    // ============================================
    // Message formatting
    // ============================================
    function formatBotMessage(text) {
        let formatted = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        let lines = formatted.split('\n');
        let html = '';
        let inList = false;
        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (!line) {
                if (inList) { html += '</ul>'; inList = false; }
                html += '<br>';
                continue;
            }
            if (line.match(/^[-*]\s+/)) {
                if (!inList) { html += '<ul style="margin: 0.5em 0; padding-left: 1.5em;">'; inList = true; }
                html += '<li>' + line.replace(/^[-*]\s+/, '') + '</li>';
            } else {
                if (inList) { html += '</ul>'; inList = false; }
                html += line + '<br>';
            }
        }
        if (inList) html += '</ul>';
        return html;
    }

    function addMessage(text, isBot = false, includeActions = false) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isBot ? 'bot-message' : 'user-message'}`;

        const now = new Date();
        const timeString = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        const formattedText = isBot ? formatBotMessage(text) : text;

        let actionsHtml = '';
        if (includeActions) {
            actionsHtml = `
                <div class="message-actions">
                    <button class="action-btn schedule-btn" onclick="window.open('${CALENDAR_URL}', '_blank')">
                        📅 Schedule a Call
                    </button>
                    <button class="action-btn form-btn" onclick="document.getElementById('chat-input-container').style.display='none'; document.getElementById('contact-form-container').style.display='block'; document.getElementById('contact-name').focus();">
                        ✉️ Send Message
                    </button>
                </div>
            `;
        }

        messageDiv.innerHTML = `
            <div class="message-content">${formattedText}</div>
            ${actionsHtml}
            <span class="message-time">${timeString}</span>
        `;

        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        conversationHistory.push({
            sender: isBot ? 'bot' : 'user',
            message: text.replace(/<[^>]*>/g, ''),
            timestamp: now.toISOString()
        });
    }

    function addBotMessage(text, delay = 0, includeActions = false) {
        if (delay > 0) {
            showTypingIndicator();
            setTimeout(() => {
                hideTypingIndicator();
                addMessage(text, true, includeActions);
            }, delay);
        } else {
            addMessage(text, true, includeActions);
        }
    }

    function showTypingIndicator() {
        typingIndicator.style.display = 'flex';
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function hideTypingIndicator() {
        typingIndicator.style.display = 'none';
    }

    // ============================================
    // LLM Chat Function
    // ============================================
    async function getLLMResponse(userMessage) {
        try {
            showTypingIndicator();
            const formData = new FormData();
            formData.append('payload', JSON.stringify({
                action: 'chat',
                message: userMessage,
                conversationHistory: conversationHistory,
                leadProfile: leadProfile,
                pageUrl: window.location.href,
                timestamp: new Date().toISOString()
            }));

            const response = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: formData });
            const data = await response.json();
            hideTypingIndicator();

            if (data.status === 'success') {
                const includeActions = data.needsHuman || false;
                addBotMessage(data.message, 0, includeActions);
            } else {
                throw new Error(data.message || 'Unknown error');
            }
        } catch (error) {
            hideTypingIndicator();
            console.error('LLM Error:', error);
            addBotMessage(`I'm having trouble connecting right now. 😕<br><br>You can:<br>• Call us: (405) 247-0083<br>• Email: sales@x-tech.tv<br>• Try asking again in a moment`, 0, true);
        }
    }

    // ============================================
    // Transcript capture — sends the conversation
    // to your Apps Script backend so no lead is lost,
    // even if the visitor never fills out the form.
    // ============================================
    function saveTranscript(reason) {
        if (transcriptSaved) return;
        const userMsgs = conversationHistory.filter(m => m.sender === 'user').length;
        if (userMsgs < 2) return; // only meaningful conversations
        transcriptSaved = true;
        const payload = JSON.stringify({
            action: 'save_transcript',
            reason: reason,
            leadProfile: leadProfile,
            conversationHistory: conversationHistory,
            pageUrl: window.location.href,
            timestamp: new Date().toISOString()
        });
        const fd = new FormData();
        fd.append('payload', payload);
        if (navigator.sendBeacon) {
            navigator.sendBeacon(GOOGLE_SCRIPT_URL, fd);
        } else {
            fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: fd, keepalive: true });
        }
    }

    window.addEventListener('pagehide', function() { saveTranscript('visitor_left'); });

    // ============================================
    // UI Event Handlers
    // ============================================
    function openChat() {
        chatOpen = true;
        chatWindow.classList.add('open');
        chatButton.classList.add('open');
        chatBadge.style.display = 'none';
        if (chatMessages.children.length === 0) initializeChat();
        chatInput.focus();
        track('chat_open');
    }

    chatButton.addEventListener('click', function() {
        if (chatOpen) {
            chatOpen = false;
            chatWindow.classList.remove('open');
            chatButton.classList.remove('open');
        } else {
            openChat();
        }
    });

    minimizeChat.addEventListener('click', function() {
        chatWindow.classList.remove('open');
        chatButton.classList.remove('open');
        chatOpen = false;
    });

    // Send message
    async function sendMessage() {
        const message = chatInput.value.trim();
        if (message && !isProcessing) {
            isProcessing = true;
            sendButton.disabled = true;
            const qr = document.getElementById('quick-replies');
            if (qr) qr.remove();

            addMessage(message, false);
            chatInput.value = '';
            chatInput.style.height = 'auto';
            track('chat_message');

            await getLLMResponse(message);

            isProcessing = false;
            sendButton.disabled = false;
            chatInput.focus();
        }
    }

    sendButton.addEventListener('click', sendMessage);

    chatInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    chatInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });

    // ============================================
    // Contact Form Management
    // ============================================
    function hideContactForm() {
        contactFormContainer.style.display = 'none';
        chatInputContainer.style.display = 'flex';
        chatInput.focus();
    }

    cancelFormBtn.addEventListener('click', hideContactForm);

    contactForm.addEventListener('submit', async function(e) {
        e.preventDefault();

        const name = document.getElementById('contact-name').value.trim();
        const email = document.getElementById('contact-email').value.trim();
        const phone = document.getElementById('contact-phone').value.trim();
        const message = document.getElementById('contact-message').value.trim();

        const submitBtn = contactForm.querySelector('.submit-btn');
        const originalText = submitBtn.textContent;
        submitBtn.textContent = 'Sending...';
        submitBtn.disabled = true;

        try {
            const formData = new FormData();
            formData.append('payload', JSON.stringify({
                action: 'submit_form',
                name: name,
                email: email,
                phone: phone,
                message: message,
                leadProfile: leadProfile,
                conversationHistory: conversationHistory,
                timestamp: new Date().toISOString(),
                source: 'LLM Chat Widget',
                pageUrl: window.location.href
            }));

            const response = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: formData });
            const data = await response.json();

            if (data.status === 'success') {
                transcriptSaved = true; // form submission already includes the transcript
                track('chat_lead_submit');
                hideContactForm();
                addBotMessage(`✅ Thank you, ${name}! Your message has been received.<br><br>We'll get back to you at ${email} within 24 hours.<br><br>For urgent matters, call us at (405) 247-0083.`, 500);
                contactForm.reset();
            } else {
                throw new Error(data.message || 'Submission failed');
            }
        } catch (error) {
            console.error('Submission error:', error);
            addBotMessage(`❌ <strong>Submission Error</strong><br><br>Please try emailing us directly at sales@x-tech.tv or call (405) 247-0083.`, 500);
            hideContactForm();
        } finally {
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
        }
    });
});
</script>

<style>
/* Quick-reply qualification chips */
.quick-replies {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 4px 0;
}

.quick-reply {
    padding: 9px 14px;
    border-radius: 999px;
    border: 1.5px solid #1C888E;
    background: white;
    color: #0F5A60;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s, color 0.2s, transform 0.2s;
}

.quick-reply:hover {
    background: #1C888E;
    color: white;
    transform: translateY(-2px);
}
</style>
